[project]
name = "faceanchor"
version = "0.1.0"
description = "Face identification -> web/social discovery -> on-chain verification"
requires-python = ">=3.12,<3.13"
dependencies = [
    "onnxruntime-gpu>=1.20",
    "onnxconverter-common>=1.14",
    "opencv-python>=4.10",
    "opencv-contrib-python>=4.10",
    "PyTurboJPEG>=1.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.13",
    "httpx[http2]>=0.27",
    "ddgs>=9.11",
    "aiolimiter>=1.2",
    "cachetools>=5.5",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "web3>=7.4",
    "solana>=0.34",
    "solders>=0.21",
    "pydantic>=2.9",
    "numpy>=1.26,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
faceanchor = "faceanchor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faceanchor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
